# Cloudflare Workers configuration for Next.js with OpenNext
name = "trippified"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Worker entry point
main = ".open-next/worker.js"

# Static assets
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Production domains (DNS for trippified.com is on Cloudflare)
[[routes]]
pattern = "trippified.com"
custom_domain = true

[[routes]]
pattern = "www.trippified.com"
custom_domain = true

# Secrets are set with `wrangler secret put` and kept across deploys.

# Preview: workers.dev only, no custom domains
[env.preview]
name = "trippified-preview"
workers_dev = true
routes = []

[env.preview.assets]
directory = ".open-next/assets"
binding = "ASSETS"
