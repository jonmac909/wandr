# Cloudflare Workers configuration for Next.js with OpenNext
name = "trippified"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Worker entry point
main = ".open-next/worker.js"

# Static assets
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Secrets are set with `wrangler secret put` and kept across deploys.

# The top level has no domains on purpose: automatic builds that run a plain
# `wrangler deploy` can never move trippified.com. Domains are attached only by
# an explicit `wrangler deploy --env production`.

# Production: trippified.com and www.trippified.com (DNS is on Cloudflare)
[env.production]
name = "trippified"
workers_dev = true

[[env.production.routes]]
pattern = "trippified.com"
custom_domain = true

[[env.production.routes]]
pattern = "www.trippified.com"
custom_domain = true

[env.production.assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Preview: workers.dev only, no custom domains
[env.preview]
name = "trippified-preview"
workers_dev = true

[env.preview.assets]
directory = ".open-next/assets"
binding = "ASSETS"
